[package]
name = "nix-launcher"
version = "0.1.0"
edition = "2021"
description = "A minimalist black and white Minecraft launcher for Linux"
license = "MIT"
repository = "https://github.com/Bobistuca/-nix-Launchear"

[dependencies]
anyhow = "1"
dirs = "5"
eframe = "0.29"
flate2 = "1"
md5 = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tar = "0.4"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
name = "nix-launcher"
maintainer = "Nix Launcher contributors"
section = "games"
priority = "optional"
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libgl1, libx11-6"
extended-description = "A minimalist black and white Minecraft launcher for Linux. Downloads the game and a matching Java runtime automatically."
assets = [
  ["target/release/nix-launcher", "usr/bin/", "755"],
  ["packaging/nix-launcher.desktop", "usr/share/applications/", "644"],
  ["packaging/nix-launcher.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
